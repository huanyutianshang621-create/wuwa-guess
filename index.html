<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鸣潮立绘猜猜看</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="on-start">
<div id="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      鸣潮立绘猜猜看
    </div>
    <div class="stats">
      <span id="stat-progress">0 / 0</span>
      <span class="sep"></span>
      <span id="stat-score">0 分</span>
    </div>
    <div class="tools">
      <button id="btn-gallery" class="ghost">图鉴</button>
      <button id="btn-reset" class="ghost">重来</button>
    </div>
  </header>

  <section id="start" class="start">
    <div class="start-inner">
      <div class="start-mark"></div>
      <h1>鸣潮立绘猜猜看</h1>
      <p class="start-sub">看图认人：先猜属性，再猜名字。<br>认出来的角色会收进图鉴，认不出来也没关系。</p>
      <div class="start-acts">
        <button id="btn-start" class="btn big">开始猜</button>
        <button id="btn-start-gallery" class="btn secondary big">看图鉴</button>
      </div>
      <p id="start-progress" class="start-progress"></p>
    </div>
  </section>

  <main id="play" hidden>
    <section class="art-wrap">
      <div id="art" class="art"></div>
    </section>

    <section class="panel">
      <div class="q-label">她的属性是</div>
      <div id="elem-row" class="elem-row"></div>

      <div class="q-label" id="name-label">她叫什么</div>
      <div id="name-row" class="name-row"></div>

      <div id="answer" class="answer" hidden></div>
    </section>
  </main>

  <section id="finish" class="finish" hidden></section>

  <section id="gallery" class="gallery" hidden>
    <div class="gallery-head">
      <span id="gallery-title">图鉴</span>
      <button id="btn-gallery-close" class="ghost">关闭</button>
    </div>
    <div id="gallery-grid" class="gallery-grid"></div>
  </section>

  <div id="lightbox" class="lightbox" hidden>
    <div class="lb-card">
      <button class="lb-close" data-lb-close aria-label="关闭">×</button>
      <div class="lb-art"><img id="lb-img" alt=""></div>
      <div class="lb-side">
        <div class="lb-name" id="lb-name"></div>
        <div class="lb-elem" id="lb-elem"><i></i><span id="lb-elem-name"></span></div>
        <div class="lb-meta" id="lb-meta"></div>
        <p class="lb-bio" id="lb-bio"></p>
        <div class="lb-foot">点空白处或按 Esc 关闭</div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
</div>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/bios.js"></script>
<script src="js/game.js"></script>
</body>
</html>
